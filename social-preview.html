<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0f2340;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: #0f2340;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 60px;
  }
  .logo {
    width: 320px;
    margin-bottom: 36px;
  }
  .tagline {
    font-size: 72px;
    font-weight: 900;
    color: #f47b20;
    letter-spacing: 0.02em;
    margin-bottom: 24px;
  }
  .divider {
    width: 90px;
    height: 5px;
    background: #f47b20;
    border-radius: 2px;
    margin-bottom: 24px;
  }
  .sub {
    font-size: 26px;
    color: rgba(255,255,255,0.75);
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .footer {
    position: absolute;
    bottom: 44px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 60px;
    font-size: 22px;
    color: rgba(255,255,255,0.45);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="handled-home-logo-cropped.svg" alt="Handled Home">
    <p class="tagline">Point. Fix. Handled.</p>
    <div class="divider"></div>
    <p class="sub">Moon Township &amp; Pittsburgh Area Handyman</p>
    <div class="footer">
      <span>412-353-5341</span>
      <span>handledhome.net</span>
    </div>
  </div>
</body>
</html>
