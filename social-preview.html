<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  .card {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
  }
  .main {
    flex: 1;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 0 80px 16px;
  }
  .logo {
    width: 500px;
  }
  .tagline {
    font-size: 62px;
    font-weight: 900;
    color: #f58220;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .sub {
    font-size: 26px;
    font-weight: 600;
    color: #0f2340;
    letter-spacing: 0.01em;
  }
  .bottom {
    flex: 0 0 88px;
    background: #0f2340;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px;
  }
  .bottom span {
    font-size: 26px;
    font-weight: 700;
    color: rgba(255,255,255,0.88);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="main">
      <img class="logo" src="handled-home-logo-cropped.svg" alt="Handled Home">
      <p class="tagline">Point. Fix. Handled.</p>
      <p class="sub">Moon Township &amp; Pittsburgh Area Handyman</p>
    </div>
    <div class="bottom">
      <span>412-353-5341</span>
      <span>handledhome.net</span>
    </div>
  </div>
</body>
</html>
